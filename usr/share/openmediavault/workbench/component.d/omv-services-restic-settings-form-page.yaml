version: "1.0"
type: component
data:
  name: omv-services-restic-settings-form-page
  type: formPage
  config:
    request:
      service: Restic
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: textInput
        name: cachedir
        label: _("Cache directory")
        value: "/var/cache/restic"
        hint: _("Directory where Restic stores its local cache. The cache speeds up operations, especially for remote repositories. Leave blank to disable caching (not recommended).")
      - type: divider
        title: _("Default excludes")
      - type: textarea
        name: exclude
        label: _("Exclude patterns")
        value: ""
        rows: 6
        hint: _("One pattern per line, applied to every backup job in addition to its own excludes (e.g. *.tmp, .Trash-*, .recycle). Lines starting with # are comments.")
      - type: checkbox
        name: excludecaches
        label: _("Exclude cache directories")
        value: false
        hint: _("Skip directories that contain a CACHEDIR.TAG file (restic --exclude-caches).")
    buttons:
      - template: submit
