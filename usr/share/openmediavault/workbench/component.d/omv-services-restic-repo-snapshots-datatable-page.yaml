version: "1.0"
type: component
data:
  name: omv-services-restic-repo-snapshots-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    # Snapshots have no "uuid"; key rows by the restic snapshot ID so
    # multi-selection (forget several snapshots) works.
    rowId: id
    stateId: a4d2f8c1-9e30-4b17-a5c6-8f2e1d7b3c09
    sorters:
      - dir: desc
        prop: time
    store:
      proxy:
        service: Restic
        get:
          method: getRepoSnapshotList
          params:
            reporef: "{{ _routeParams.uuid }}"
    columns:
      - name: _("ID")
        prop: id_short
        flexGrow: 1
        sortable: false
      - name: _("Date / Time")
        prop: time_formatted
        flexGrow: 2
        sortable: true
      - name: _("Hostname")
        prop: hostname
        flexGrow: 1
        sortable: true
      - name: _("Paths")
        prop: paths_str
        flexGrow: 3
        sortable: false
      - name: _("Tags")
        prop: tags_str
        flexGrow: 1
        sortable: false
    actions:
      - type: iconButton
        icon: mdi:restore
        tooltip: _("Restore this snapshot to a shared folder")
        execute:
          type: url
          url: "/services/restic/repos/snapshots/{{ _routeParams.uuid }}/restore/{{ _selected[0].id }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
      - type: iconButton
        icon: mdi:information-outline
        tooltip: _("Inspect snapshot")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Inspecting snapshot ...")
              startOnInit: true
              request:
                service: Restic
                method: inspectRepoSnapshot
                params:
                  reporef: "{{ _routeParams.uuid }}"
                  snapshotid: "{{ _selected[0].id }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
      - type: iconButton
        icon: mdi:file-tree
        tooltip: _("List files in snapshot")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Listing snapshot files ...")
              startOnInit: true
              request:
                service: Restic
                method: listRepoSnapshotFiles
                params:
                  reporef: "{{ _routeParams.uuid }}"
                  snapshotid: "{{ _selected[0].id }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
      - type: menu
        icon: mdi:delete
        tooltip: _("Forget (delete) selected snapshots")
        enabledConstraints:
          minSelected: 1
        actions:
          - text: _("Forget")
            icon: mdi:delete-outline
            confirmationDialogConfig:
              template: confirmation-danger
              message: _("Remove the selected snapshots from the repository? The data they reference is kept until the repository is pruned.")
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Forgetting snapshots ...")
                  startOnInit: true
                  request:
                    service: Restic
                    method: forgetRepoSnapshots
                    params:
                      reporef: "{{ _routeParams.uuid }}"
                      snapshotids: "{{ _selected | map('get', 'id') | join(',') }}"
                      prune: false
          - text: _("Forget and prune")
            icon: mdi:delete-forever
            confirmationDialogConfig:
              template: confirmation-danger
              message: _("Remove the selected snapshots and prune the data no longer referenced by any snapshot? This cannot be undone and may take a long time.")
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Forgetting snapshots and pruning ...")
                  startOnInit: true
                  request:
                    service: Restic
                    method: forgetRepoSnapshots
                    params:
                      reporef: "{{ _routeParams.uuid }}"
                      snapshotids: "{{ _selected | map('get', 'id') | join(',') }}"
                      prune: true
      - type: iconButton
        icon: mdi:refresh
        tooltip: _("Refresh snapshot list")
        execute:
          type: reload
